[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-assistant-demo"
version = "0.1.0"
description = "Structured LangChain and LangGraph order assistant examples"
requires-python = ">=3.11,<4"
dependencies = ["langgraph>=1,<2"]

[project.optional-dependencies]
llm = ["langchain>=1,<2", "langchain-groq>=1,<2", "python-dotenv>=1,<2"]
ui = ["streamlit>=1.66,<2", "langchain>=1,<2", "langchain-groq>=1,<2", "python-dotenv>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
order-assistant = "order_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
order_assistant = ["policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
